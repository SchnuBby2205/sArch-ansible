# Verlinkt (oder kopiert) configs/, bin/, themes/Matugen und fonts/ aus diesem Repo.

- name: Config-Ordner im Repo finden (ohne installConfigs)
  ansible.builtin.find:
    paths: "{{ sarch_repo }}/configs"
    file_type: directory
    recurse: false
    excludes: [installConfigs]
  register: sarch_config_dirs

- name: Liste der Ziele zusammenstellen
  ansible.builtin.set_fact:
    sarch_dotfile_targets: |
      {% set t = [] %}
      {% for d in sarch_config_dirs.files | map(attribute='path') | sort %}
      {%   set _ = t.append({'src': d, 'dest': sarch_home ~ '/.config/' ~ (d | basename)}) %}
      {% endfor %}
      {% set _ = t.append({'src': sarch_repo ~ '/bin',            'dest': sarch_home ~ '/.config/sArch/bin'}) %}
      {% set _ = t.append({'src': sarch_repo ~ '/themes/Matugen', 'dest': sarch_home ~ '/.themes/Matugen'}) %}
      {{ t }}

- name: Elternordner anlegen
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ sarch_home }}/.config"
    - "{{ sarch_home }}/.config/sArch"
    - "{{ sarch_home }}/.themes"
    - "{{ sarch_home }}/.local/share/fonts"

- name: Vorhandene Ziele prüfen
  ansible.builtin.stat:
    path: "{{ item.dest }}"
    follow: false
  loop: "{{ sarch_dotfile_targets }}"
  loop_control: { label: "{{ item.dest }}" }
  register: sarch_dest_stat

- name: Bestehende echte Ordner sichern (*.bak-<Zeitstempel>)
  when:
    - sarch_dotfiles_mode == 'link'
    - item.stat.exists
    - not item.stat.islnk
  ansible.builtin.command:
    cmd: "mv '{{ item.item.dest }}' '{{ item.item.dest }}.bak-{{ ansible_date_time.epoch }}'"
  loop: "{{ sarch_dest_stat.results }}"
  loop_control: { label: "{{ item.item.dest }}" }
  changed_when: true

- name: Configs verlinken
  when: sarch_dotfiles_mode == 'link'
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ sarch_dotfile_targets }}"
  loop_control: { label: "{{ item.dest }} -> {{ item.src }}" }

- name: Alte Symlinks entfernen (Umstieg von link auf copy)
  when:
    - sarch_dotfiles_mode == 'copy'
    - item.stat.islnk | default(false)
  ansible.builtin.file:
    path: "{{ item.item.dest }}"
    state: absent
  loop: "{{ sarch_dest_stat.results }}"
  loop_control: { label: "{{ item.item.dest }}" }

- name: Configs kopieren (nur fehlende Dateien, lokale Änderungen bleiben)
  when: sarch_dotfiles_mode == 'copy'
  ansible.builtin.copy:
    src: "{{ item.src }}/"
    dest: "{{ item.dest }}/"
    remote_src: true
    mode: preserve
    force: false
  loop: "{{ sarch_dotfile_targets }}"
  loop_control: { label: "{{ item.dest }}" }

# --- matugen-Farbdateien im Repo ausblenden (nur link-Modus) -----------
# Liest die output_path-Einträge aus configs/matugen/config.toml und markiert die passenden
# Repo-Dateien mit "git update-index --skip-worktree". matugen kann sie weiter überschreiben,
# Git zeigt die Änderungen aber nicht mehr an (git status bleibt sauber).
- name: matugen-Farbdateien in Git ausblenden
  when:
    - sarch_dotfiles_mode == 'link'
    - sarch_ignore_matugen_changes | bool
  block:
    - name: matugen-Konfiguration lesen
      ansible.builtin.slurp:
        src: "{{ sarch_repo }}/configs/matugen/config.toml"
      register: sarch_matugen_cfg

    - name: Ausgabedateien auf Repo-Pfade abbilden
      ansible.builtin.set_fact:
        sarch_matugen_repo_files: >-
          {{ sarch_matugen_cfg.content | b64decode
             | regex_findall("(?m)^[ ]*output_path[ ]*=[ ]*['\"]([^'\"]+)['\"]")
             | map('regex_replace', '^~/[.]config/', 'configs/')
             | map('regex_replace', '^~/[.]themes/Matugen/', 'themes/Matugen/')
             | select('match', '^(configs|themes)/')
             | list }}

    - name: Dateien als skip-worktree markieren
      ansible.builtin.shell:
        cmd: |
          set -eo pipefail
          cd {{ sarch_repo | quote }}
          for f in {{ sarch_matugen_repo_files | map('quote') | join(' ') }}; do
            if git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
              git ls-files -v -- "$f" | grep -q '^S' && continue
              git update-index --skip-worktree -- "$f" && echo "skip-worktree: $f"
            else
              grep -qxF "/$f" .git/info/exclude 2>/dev/null && continue
              echo "/$f" >> .git/info/exclude && echo "exclude: $f"
            fi
          done
        executable: /bin/bash
      register: sarch_matugen_skip
      changed_when: sarch_matugen_skip.stdout | length > 0

- name: Fonts aus dem Repo kopieren
  ansible.builtin.copy:
    src: "{{ sarch_repo }}/fonts/"
    dest: "{{ sarch_home }}/.local/share/fonts/sArch/"
    remote_src: true
    mode: "0644"
    directory_mode: "0755"
  notify: Font-Cache aktualisieren

- name: Wallpaper klonen
  ansible.builtin.git:
    repo: "{{ sarch_wallpaper_repo }}"
    dest: "{{ sarch_wallpaper_dir }}"
    depth: 1
    update: false
  notify: Wallpaper-Thumbnails erzeugen
