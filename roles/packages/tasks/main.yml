- name: Pakete aus den offiziellen Repos installieren
  become: true
  community.general.pacman:
    name: "{{ sarch_systemdeps + sarch_audiodeps + sarch_programs + sarch_fonts + sarch_extra_packages }}"
    state: present

- name: Dienste aktivieren
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop: "{{ sarch_services }}"

- name: SDDM-Konfigurationsordner anlegen
  become: true
  ansible.builtin.file:
    path: /etc/sddm.conf.d
    state: directory
    mode: "0755"
